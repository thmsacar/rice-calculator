<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Rice Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Perfect Rice Calculator</h1>
        
        <div class="form-group">
            <label for="riceAmount">Rice Amount (grams)</label>
            <input type="number" id="riceAmount" placeholder="e.g. 120" min="1">
        </div>

        <div class="form-group">
            <label for="riceType">Rice Type</label>
            <select id="riceType">
                <option value="basmati">White Basmati</option>
                <option value="jasmine">Jasmine</option>
                <option value="sushi">Sushi / Short Grain</option>
                <option value="baldo">Baldo / Medium Grain</option>
                <option value="brown">Brown Rice</option>
            </select>
        </div>

        <div class="advanced-toggle" onclick="toggleAdvanced()">⚙️ Advanced Settings (Pro Mode)</div>
        
        <div class="advanced-settings" id="advancedSettings">
            <div class="form-group">
                <label for="evaporationRate">Evaporation Rate (g/min)</label>
                <input type="number" id="evaporationRate" value="3.5" step="0.1">
                <small style="color:#888; margin-top:5px;">Default is 3.5g for a standard 20-24cm pot with a lid.</small>
            </div>
        </div>

        <button onclick="calculateWater()">Calculate Water</button>

        <div class="result-box" id="resultBox">
            <h2><span id="waterResult">0</span>g Water</h2>
            <p>Cook time: <span id="timeResult">0</span> mins</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
